<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>起動中</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  #app { border: 0; width: 100%; height: calc(100% - 64px); display: block; background: #fff; }
  .bar { height: 64px; display: flex; align-items: center; justify-content: space-between;
         padding: 0 16px; background: #111; color: #fff; font-family: -apple-system, sans-serif; }
  .home { color: #fff; background: #333; border-radius: 999px; padding: 10px 20px;
          text-decoration: none; font-size: 15px; }
  .fallback { color: #fff; font-size: 13px; }
  #title { font-size: 14px; opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40%; }
</style>
</head>
<body>
<iframe id="app" allow="fullscreen; clipboard-write"></iframe>
<div class="bar">
  <a class="home" href="/">🏠 ホーム</a>
  <span id="title"></span>
  <a class="fallback" id="fallback" target="_blank" rel="noopener">別タブ</a>
</div>
<script>
  const p = new URLSearchParams(location.search);
  const url = p.get('url');
  const title = p.get('title') || '';
  const frame = document.getElementById('app');
  if (url && /^https?:\/\//.test(url)) {
    frame.src = url;
    document.getElementById('fallback').href = url;
  }
  document.getElementById('title').textContent = title;
  document.title = title;

  // ===== アプリ内課金ブリッジ（仙人ポイント） =====
  // iframe内のアプリは次のように依頼できる:
  //   parent.postMessage({ type: 'sennin:iap', action: 'purchase', sku: 'pro_unlock', requestId: '1' }, '*');
  //   parent.postMessage({ type: 'sennin:iap', action: 'owned', requestId: '2' }, '*');
  // 結果は 'sennin:iap:result'（requestId 付き）で返る。購入は利用者の確認後にのみ実行される。
  async function api(path, body) {
    const r = await fetch(path, {
      method: body ? 'POST' : 'GET',
      credentials: 'same-origin',
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.error || `HTTP ${r.status}`); e.status = r.status; throw e; }
    return j;
  }
  const reply = (requestId, payload) =>
    frame.contentWindow && frame.contentWindow.postMessage({ type: 'sennin:iap:result', requestId, ...payload }, '*');

  window.addEventListener('message', async (e) => {
    if (e.source !== frame.contentWindow) return;
    const m = e.data;
    if (!m || m.type !== 'sennin:iap') return;
    const { requestId, action, sku } = m;
    try {
      if (action === 'owned') {
        const r = await api('/api/iap/owned');
        return reply(requestId, { ok: true, skus: r.skus });
      }
      if (action === 'purchase') {
        const q = await api(`/api/iap/products/${encodeURIComponent(sku)}`);
        const ok = confirm(`「${q.item_title}」の「${q.name}」を ${Number(q.price_points).toLocaleString()} pt で購入しますか？\n仙人ポイントから引き落とされます。`);
        if (!ok) return reply(requestId, { ok: false, error: 'キャンセルされました' });
        const r = await api('/api/iap/purchase', { sku });
        return reply(requestId, { ok: true, sku, points: r.points ?? null, already: !!r.already });
      }
      reply(requestId, { ok: false, error: '不明な操作です' });
    } catch (err) {
      reply(requestId, { ok: false, error: err.message, status: err.status ?? null });
    }
  });
</script>
</body>
</html>
