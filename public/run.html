<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>起動中</title>
<style>
  :root {
    --glass-bg: rgba(255, 255, 255, 0.72);
    --glass-border: rgba(255, 255, 255, 0.55);
    --glass-shadow: 0 16px 40px rgba(0, 0, 0, 0.18), inset 0 1px 1px rgba(255, 255, 255, 0.8);
    --text-primary: #111827;
    --text-secondary: #4b5563;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: #09090b;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    touch-action: none;
  }

  /* アプリ本体（全画面表示） */
  #app {
    border: 0;
    width: 100%;
    height: 100%;
    display: none;
    background: #fff;
  }

  /* エラー・ステータス表示 */
  #msg {
    color: #f4f4f5;
    padding: 32px 24px;
    line-height: 1.7;
    font-size: 15px;
    text-align: center;
    margin-top: 25vh;
  }

  /* ドラッグ可能なフローティングメニューボタン（Liquid Glass） */
  .menu-fab {
    position: fixed;
    top: max(16px, env(safe-area-inset-top, 16px));
    right: max(16px, env(safe-area-inset-right, 16px));
    z-index: 20;
    width: 44px;
    height: 44px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.45);
    background: rgba(28, 28, 30, 0.55);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    user-select: none;
    touch-action: none;
    transition: background 0.2s, box-shadow 0.2s;
  }
  .menu-fab:active {
    cursor: grabbing;
  }
  .menu-fab svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
    pointer-events: none;
  }

  /* モーダル背景オーバーレイ */
  .wrap {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.38);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .wrap.open {
    opacity: 1;
    pointer-events: auto;
  }

  /* 中央配置用 */
  .wrap.center {
    align-items: center;
    padding: 20px;
  }

  /* Liquid Glass シート（ボトムシート） */
  .sheet {
    background: var(--glass-bg);
    backdrop-filter: blur(28px) saturate(200%);
    -webkit-backdrop-filter: blur(28px) saturate(200%);
    border-top: 1px solid var(--glass-border);
    border-left: 1px solid rgba(255, 255, 255, 0.35);
    border-right: 1px solid rgba(255, 255, 255, 0.35);
    box-shadow: var(--glass-shadow);
    color: var(--text-primary);
    border-radius: 28px 28px 0 0;
    padding: 24px 22px calc(24px + env(safe-area-inset-bottom, 0px));
    width: 100%;
    max-width: 480px;
    box-sizing: border-box;
    transform: translateY(24px);
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .wrap.open .sheet {
    transform: translateY(0);
  }

  /* 中央ガラスカード */
  .wrap.center .sheet {
    border-radius: 26px;
    border: 1px solid var(--glass-border);
    padding: 24px 22px;
    max-width: 340px;
    text-align: center;
    transform: scale(0.94);
  }
  .wrap.center.open .sheet {
    transform: scale(1);
  }

  /* ヘッダー行 */
  .sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .sheet h3 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text-primary);
  }
  .wrap.center .sheet h3 {
    margin-bottom: 8px;
  }

  /* SenninPay バッジ（点なし） */
  .brand-badge {
    display: inline-flex;
    align-items: center;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #1d4ed8;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.85), rgba(219, 234, 254, 0.7));
    border: 1px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.12), inset 0 1px 0 #fff;
    white-space: nowrap;
  }

  .sheet p {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.6;
    margin: 6px 0;
  }

  /* 課金アイテム・金額ボックス */
  .pay-box {
    margin: 14px 0 10px;
    padding: 16px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.52);
    border: 1px solid rgba(255, 255, 255, 0.75);
    box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.7);
  }
  .pay-item-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    margin: 0 0 4px;
  }
  .amt {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    margin: 0;
  }

  .err {
    color: #dc2626;
    font-size: 13px;
    font-weight: 500;
    min-height: 1.2em;
    margin-top: 8px;
  }

  /* ボタンレイアウト */
  .row {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  .btn {
    flex: 1;
    border: 1px solid transparent;
    border-radius: 15px;
    padding: 13px 16px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.2s ease;
  }
  .btn:active:not(:disabled) {
    transform: scale(0.97);
  }
  .btn.pri {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #fff;
    border-color: rgba(255, 255, 255, 0.25);
    box-shadow: 0 6px 18px rgba(37, 99, 235, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.35);
  }
  .btn.danger {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: #fff;
    border-color: rgba(255, 255, 255, 0.25);
    box-shadow: 0 6px 18px rgba(220, 38, 38, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.35);
  }
  .btn.sec {
    background: rgba(255, 255, 255, 0.65);
    color: var(--text-primary);
    border-color: rgba(255, 255, 255, 0.8);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05), inset 0 1px 0 #fff;
  }
  .btn:disabled {
    opacity: 0.5;
    cursor: default;
  }

  /* ===== 支払い完了アニメーション ===== */
  .pay-done-view {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 0 16px;
    text-align: center;
    animation: fadeIn 0.25s ease forwards;
  }
  .check-circle {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    box-shadow: 0 10px 26px rgba(37, 99, 235, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
    animation: popScale 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }
  .check-circle svg {
    width: 34px;
    height: 34px;
    stroke: #fff;
    stroke-width: 3.2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .check-path {
    stroke-dasharray: 48;
    stroke-dashoffset: 48;
    animation: drawCheck 0.4s 0.18s ease-out forwards;
  }
  .pay-done-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary);
    margin: 0 0 4px;
  }
  .pay-done-sub {
    font-size: 14px;
    font-weight: 600;
    color: #1d4ed8;
    margin: 0;
  }

  @keyframes popScale {
    0% { transform: scale(0.4); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes drawCheck {
    to { stroke-dashoffset: 0; }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== ポイント獲得モーダル用装飾 ===== */
  .award-icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 12px;
    border-radius: 18px;
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(245, 158, 11, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.45);
    animation: popScale 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }
  .award-icon svg {
    width: 30px;
    height: 30px;
    fill: currentColor;
  }
  .award-amt {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #d97706;
    margin: 4px 0;
  }
</style>
</head>
<body>
<iframe id="app" sandbox="allow-scripts" allow="fullscreen; clipboard-write"></iframe>
<div id="msg" hidden></div>

<!-- ドラッグ可能な三点リーダーボタン -->
<button id="menuBtn" class="menu-fab" type="button" aria-label="メニューを開く">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="5" cy="12" r="2.2"/>
    <circle cx="12" cy="12" r="2.2"/>
    <circle cx="19" cy="12" r="2.2"/>
  </svg>
</button>

<!-- アプリ終了確認モーダル -->
<div id="exitModal" class="wrap center" role="dialog" aria-modal="true">
  <div class="sheet">
    <h3>アプリを終了しますか？</h3>
    <p id="exitAppName" style="font-weight:600; color:#111827;"></p>
    <p>保存されていないデータは失われる場合があります。</p>
    <div class="row">
      <button id="exitCancel" class="btn sec" type="button">続ける</button>
      <button id="exitOk" class="btn danger" type="button">終了する</button>
    </div>
  </div>
</div>

<!-- 許可の確認 -->
<div id="consent" class="wrap" role="dialog" aria-modal="true">
  <div class="sheet">
    <div class="sheet-header">
      <h3>アプリに情報を渡しますか？</h3>
    </div>
    <p id="consentText"></p>
    <p>許可しないと、このアプリは開けません。許可したあとも、いつでも取り消せます。</p>
    <div id="consentErr" class="err"></div>
    <div class="row">
      <button id="consentNo" class="btn sec" type="button">ホームに戻る</button>
      <button id="consentOk" class="btn pri" type="button">許可する</button>
    </div>
  </div>
</div>

<!-- 支払いの確認（SenninPay） -->
<div id="pay" class="wrap" role="dialog" aria-modal="true">
  <div class="sheet">
    <!-- 支払い確認画面 -->
    <div id="payFormView">
      <div class="sheet-header">
        <h3>ポイントを支払いますか？</h3>
        <span class="brand-badge">SenninPay</span>
      </div>
      <div class="pay-box">
        <div id="payTitle" class="pay-item-name"></div>
        <div id="payAmt" class="amt"></div>
      </div>
      <p>仙人ポイント残高から引き落とされます。</p>
      <div id="payErr" class="err"></div>
      <div class="row">
        <button id="payCancel" class="btn sec" type="button">キャンセル</button>
        <button id="payOk" class="btn pri" type="button">支払う</button>
      </div>
    </div>

    <!-- 支払い完了アニメーション画面 -->
    <div id="payDoneView" class="pay-done-view" hidden>
      <div class="check-circle">
        <svg viewBox="0 0 36 36">
          <path class="check-path" d="M8 18.5l7 7L28 11" />
        </svg>
      </div>
      <div class="pay-done-title">お支払い完了</div>
      <div id="payDoneAmt" class="pay-done-sub"></div>
    </div>
  </div>
</div>

<!-- ポイント獲得モーダル -->
<div id="awardModal" class="wrap center" role="dialog" aria-modal="true">
  <div class="sheet">
    <div class="award-icon">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2l2.9 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l7.1-1.01L12 2z"/>
      </svg>
    </div>
    <h3>ポイントを獲得しました！</h3>
    <div id="awardAmt" class="award-amt"></div>
    <p id="awardReason" style="font-weight:500; color:#111827;"></p>
    <div class="row">
      <button id="awardOk" class="btn pri" type="button">OK</button>
    </div>
  </div>
</div>

<script>
  const CH = 'sennin-app';
  const p = new URLSearchParams(location.search);
  const id = p.get('id') || '';
  const appTitle = p.get('title') || '';
  const enc = encodeURIComponent(id);
  const $ = (s) => document.querySelector(s);
  const frame = $('#app');

  document.title = appTitle || '起動中';
  $('#exitAppName').textContent = appTitle ? `「${appTitle}」` : '';

  let access = null;
  let payReq = null;

  // ===== ドラッグ移動のロジック (マウス & タッチ対応) =====
  const menuBtn = $('#menuBtn');
  let isDragging = false;
  let hasMoved = false;
  let startX, startY, initialX, initialY;

  function onDragStart(clientX, clientY) {
    isDragging = true;
    hasMoved = false;
    const rect = menuBtn.getBoundingClientRect();
    initialX = rect.left;
    initialY = rect.top;
    startX = clientX;
    startY = clientY;

    menuBtn.style.top = initialY + 'px';
    menuBtn.style.right = 'auto';
    menuBtn.style.left = initialX + 'px';
  }

  function onDragMove(clientX, clientY) {
    if (!isDragging) return;
    const dx = clientX - startX;
    const dy = clientY - startY;

    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
      hasMoved = true;
    }

    let newX = initialX + dx;
    let newY = initialY + dy;

    const maxX = window.innerWidth - menuBtn.offsetWidth;
    const maxY = window.innerHeight - menuBtn.offsetHeight;
    newX = Math.max(10, Math.min(newX, maxX - 10));
    newY = Math.max(10, Math.min(newY, maxY - 10));

    menuBtn.style.left = newX + 'px';
    menuBtn.style.top = newY + 'px';
  }

  function onDragEnd() {
    isDragging = false;
  }

  menuBtn.addEventListener('mousedown', (e) => {
    onDragStart(e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', (e) => {
    onDragMove(e.clientX, e.clientY);
  });
  window.addEventListener('mouseup', () => {
    onDragEnd();
  });

  menuBtn.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      onDragStart(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (isDragging && e.touches.length === 1) {
      onDragMove(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: true });
  window.addEventListener('touchend', () => {
    onDragEnd();
  });

  menuBtn.onclick = () => {
    if (hasMoved) return;
    $('#exitModal').classList.add('open');
  };

  $('#exitCancel').onclick = () => {
    $('#exitModal').classList.remove('open');
  };
  $('#exitOk').onclick = () => {
    location.href = '/';
  };
  $('#exitModal').onclick = (e) => {
    if (e.target === $('#exitModal')) $('#exitModal').classList.remove('open');
  };

  // ===== サーバーとの通信 =====
  async function call(path, init = {}) {
    try {
      const r = await fetch(path, {
        credentials: 'same-origin',
        method: init.method || 'GET',
        headers: init.body !== undefined ? { 'content-type': 'application/json' } : undefined,
        body: init.body,
      });
      const body = await r.json().catch(() => ({}));
      return { ok: r.ok && body.ok !== false, status: r.status, body };
    } catch {
      return { ok: false, status: 0, body: { error: '通信に失敗しました。時間をおいてお試しください。', code: 'network' } };
    }
  }

  async function refresh() {
    const r = await call(`/api/apps/${enc}/access`);
    if (r.status === 401) {
      location.assign(`/auth/login?next=${encodeURIComponent(location.pathname + location.search)}`);
      return null;
    }
    if (!r.ok) { showMsg(r.body.error || 'このアプリは開けません（入手していない、または準備中です）'); return null; }
    access = r.body;
    return access;
  }

  async function start() {
    if (!id) return showMsg('アプリが指定されていません');
    const a = await refresh();
    if (!a) return;
    if (a.needsConsent && !a.consented) return showConsent(a);
    await openFrame();
  }

  async function openFrame() {
    const r = await fetch(`/api/apps/${enc}/html`, { credentials: 'same-origin' });
    if (r.status === 401) return location.assign(`/auth/login?next=${encodeURIComponent(location.pathname + location.search)}`);
    if (!r.ok) return showMsg('このアプリは開けません（入手していない、または準備中です）');
    frame.srcdoc = injectBridge(await r.text());
    frame.style.display = 'block';
    $('#msg').hidden = true;
  }

  function injectBridge(html) {
    const script = `<script>(${appBridge.toString()})(${JSON.stringify(CH)});<\/script>`;
    return /<head[^>]*>/i.test(html)
      ? html.replace(/<head[^>]*>/i, (m) => m + script)
      : script + html;
  }

  function appBridge(channel) {
    var pending = {};
    var seq = 0;
    function newId() { seq += 1; return seq + '-' + Math.random().toString(36).slice(2, 10); }
    function makeRequestId() { return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12); }
    function call(type, data, timeoutMs) {
      return new Promise(function (resolve, reject) {
        var id = newId();
        var timer = setTimeout(function () {
          delete pending[id];
          var e = new Error('ホームからの応答がありませんでした。');
          e.code = 'timeout';
          reject(e);
        }, timeoutMs || 20000);
        pending[id] = function (m) {
          clearTimeout(timer);
          if (m.ok) resolve(m.data);
          else {
            var e = new Error(m.error || '失敗しました。');
            e.code = m.code || 'error';
            e.points = m.points;
            reject(e);
          }
        };
        parent.postMessage({ channel: channel, id: id, type: type, data: data || {} }, '*');
      });
    }
    window.addEventListener('message', function (e) {
      if (e.source !== parent) return;
      var m = e.data;
      if (!m || m.channel !== channel || !pending[m.id]) return;
      var f = pending[m.id];
      delete pending[m.id];
      f(m);
    });
    window.senninapp = {
      account: function () { return call('account'); },
      consent: function () { return call('consent'); },
      charge: function (amount, title, requestId) {
        return call('charge', { amount: amount, title: title, requestId: requestId || makeRequestId() }, 180000);
      },
      award: function (amount, reason, requestId) {
        return call('award', { amount: amount, reason: reason || '', requestId: requestId || makeRequestId() });
      }
    };
  }

  function showConsent(a) {
    const g = a.grant ? `このアプリは、ポイントを配ることがあります（あと ${Number(a.grant.remaining).toLocaleString('ja-JP')}pt まで）。` : '';
    $('#consentText').textContent = `あなたの表示名と、仙人アカウントの連携の有無を、このアプリに渡します。${g}`;
    $('#consentErr').textContent = '';
    $('#consent').classList.add('open');
  }

  $('#consentOk').onclick = async () => {
    $('#consentOk').disabled = true;
    const r = await call(`/api/apps/${enc}/consent`, { method: 'POST', body: '{}' });
    $('#consentOk').disabled = false;
    if (!r.ok) { $('#consentErr').textContent = r.body.error || '許可できませんでした。もう一度お試しください。'; return; }
    $('#consent').classList.remove('open');
    await refresh();
    await openFrame();
  };
  $('#consentNo').onclick = () => { location.href = '/'; };

  // ===== 支払い確認 & 完了アニメーション =====
  function showPay(req) {
    payReq = req;
    // フォーム表示をリセット
    $('#payFormView').hidden = false;
    $('#payDoneView').hidden = true;
    $('#payTitle').textContent = req.title;
    $('#payAmt').textContent = `${Number(req.amount).toLocaleString('ja-JP')} pt`;
    $('#payErr').textContent = '';
    $('#payOk').disabled = false;
    $('#payCancel').disabled = false;
    $('#pay').classList.add('open');
  }

  function closePay(reply) {
    const req = payReq;
    if (!req) return;
    payReq = null;
    $('#pay').classList.remove('open');
    req.resolve(reply);
  }

  $('#payOk').onclick = async () => {
    const req = payReq;
    if (!req || req.inFlight || req.completing) return;
    req.inFlight = true;
    $('#payOk').disabled = true;
    $('#payCancel').disabled = true;
    const r = await call(`/api/apps/${enc}/charge`, {
      method: 'POST',
      body: JSON.stringify({ amount: req.amount, title: req.title, requestId: req.requestId }),
    });
    req.inFlight = false;
    if (r.ok) {
      // 支払い完了アニメーションを表示してから閉じる
      req.completing = true;
      $('#payDoneAmt').textContent = `${Number(req.amount).toLocaleString('ja-JP')} pt 支払いました`;
      $('#payFormView').hidden = true;
      $('#payDoneView').hidden = false;
      setTimeout(() => {
        closePay({ ok: true, data: r.body });
      }, 1250);
      return;
    }
    if (r.status === 0 || r.status === 503) {
      $('#payErr').textContent = r.body.error || '通信に失敗しました。もう一度「支払う」を押してください。';
      $('#payOk').disabled = false;
      $('#payCancel').disabled = false;
      return;
    }
    closePay({ ok: false, code: r.body.code || 'error', error: r.body.error || '支払えませんでした。', points: r.body.points });
  };

  $('#payCancel').onclick = () => {
    if (!payReq || payReq.inFlight || payReq.completing) return;
    closePay({ ok: false, code: 'cancelled', error: 'お支払いを取り消しました。' });
  };

  // 支払いモーダル外側タップでキャンセル
  $('#pay').onclick = (e) => {
    if (e.target === $('#pay')) {
      $('#payCancel').onclick();
    }
  };

  // ===== ポイント獲得モーダル =====
  function showAwardModal(amount, reason) {
    $('#awardAmt').textContent = `+${Number(amount).toLocaleString('ja-JP')} pt`;
    const reasonEl = $('#awardReason');
    if (reason && reason.trim()) {
      reasonEl.textContent = reason.trim();
      reasonEl.hidden = false;
    } else {
      reasonEl.hidden = true;
    }
    $('#awardModal').classList.add('open');
  }

  function closeAwardModal() {
    $('#awardModal').classList.remove('open');
  }

  $('#awardOk').onclick = closeAwardModal;
  $('#awardModal').onclick = (e) => {
    if (e.target === $('#awardModal')) closeAwardModal();
  };

  async function handle(type, data) {
    if (type === 'account') {
      const a = await refresh();
      if (!a) return { ok: false, code: 'error', error: 'アカウント情報を取得できませんでした。' };
      if (!a.consented) return { ok: false, code: 'not_consented', error: consentText(a) };
      return { ok: true, data: { sub: a.user.sub, name: a.user.name, sennin: a.sennin, grant: a.grant } };
    }
    if (type === 'consent') {
      return access?.consented
        ? { ok: true, data: { consented: true } }
        : { ok: false, code: 'not_consented', error: consentText(access) };
    }
    if (type === 'charge') {
      const amount = data.amount;
      const title = typeof data.title === 'string' ? data.title.trim() : '';
      const requestIdValue = typeof data.requestId === 'string' ? data.requestId : '';
      if (!Number.isInteger(amount) || amount < 1) return { ok: false, code: 'invalid', error: '支払うポイントは 1 以上の整数で指定してください。' };
      if (!title) return { ok: false, code: 'invalid', error: '品名を指定してください。' };
      if (payReq) return { ok: false, code: 'busy', error: 'ほかの支払いの確認が出ています。' };
      return new Promise((resolve) => showPay({ amount, title, requestId: requestIdValue, resolve }));
    }
    if (type === 'award') {
      if (!access?.consented) return { ok: false, code: 'not_consented', error: consentText(access) };
      const r = await call(`/api/apps/${enc}/award`, {
        method: 'POST',
        body: JSON.stringify({ amount: data.amount, reason: data.reason, requestId: data.requestId }),
      });
      if (!r.ok) return { ok: false, code: r.body.code || 'error', error: r.body.error || 'ポイントを配れませんでした。', points: r.body.remaining };
      refresh();
      // ポイント獲得モーダルを表示
      showAwardModal(data.amount, data.reason);
      return { ok: true, data: r.body };
    }
    return { ok: false, code: 'unknown_request', error: '対応していない依頼です。' };
  }

  function consentText(a) {
    return a && a.needsConsent
      ? 'ユーザー情報の共有を許可していません。アプリを開き直すと、確認が出ます。'
      : 'このアプリでは、ユーザー情報は使えません。';
  }

  window.addEventListener('message', (e) => {
    if (e.source !== frame.contentWindow) return;
    const m = e.data;
    if (!m || m.channel !== CH || typeof m.id !== 'string' || typeof m.type !== 'string') return;
    handle(m.type, m.data || {}).then((reply) => {
      frame.contentWindow && frame.contentWindow.postMessage({ channel: CH, id: m.id, ...reply }, '*');
    }).catch((err) => {
      frame.contentWindow && frame.contentWindow.postMessage({ channel: CH, id: m.id, ok: false, code: 'error', error: String(err.message || err) }, '*');
    });
  });

  window.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (payReq) { if (!payReq.inFlight && !payReq.completing) $('#payCancel').onclick(); return; }
    if ($('#awardModal').classList.contains('open')) { closeAwardModal(); return; }
    if ($('#exitModal').classList.contains('open')) { $('#exitModal').classList.remove('open'); return; }
    if ($('#consent').classList.contains('open')) $('#consentNo').onclick();
  });

  function showMsg(text) {
    const el = $('#msg');
    el.textContent = text;
    el.hidden = false;
    frame.style.display = 'none';
  }

  start();
</script>
</body>
</html>
