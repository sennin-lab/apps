<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>senninstudio 管理者</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F5F5F7] text-[#1D1D1F] font-sans min-h-screen">

<header class="bg-white/90 backdrop-blur border-b border-black/5 px-5 py-3 flex items-center justify-between sticky top-0 z-10">
  <div class="font-semibold">senninstudio <span class="font-normal text-gray-500">管理者</span></div>
  <div class="flex items-center gap-4 text-sm">
    <a href="/studio.html" class="text-blue-600 underline">studio（開発者画面）</a>
    <div id="whoami" class="flex items-center gap-3"></div>
  </div>
</header>

<section id="gate" class="hidden max-w-md mx-auto mt-16 bg-white rounded-2xl p-6 shadow space-y-4"></section>

<main id="app" class="hidden max-w-6xl mx-auto p-4 space-y-4">

  <section class="bg-white rounded-2xl p-5 shadow space-y-3">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <h2 class="font-semibold">アプリの審査・公開</h2>
      <div id="filters" class="flex flex-wrap gap-1.5 text-xs">
        <button data-f="" class="px-3 py-1.5 rounded-full bg-blue-600 text-white">すべて</button>
        <button data-f="in_review" class="px-3 py-1.5 rounded-full bg-gray-100">審査中</button>
        <button data-f="published" class="px-3 py-1.5 rounded-full bg-gray-100">公開中</button>
        <button data-f="suspended" class="px-3 py-1.5 rounded-full bg-gray-100">停止中</button>
        <button data-f="draft" class="px-3 py-1.5 rounded-full bg-gray-100">下書き</button>
      </div>
    </div>
    <p class="text-xs text-gray-500">「公開」を押すと、ストアに表示されます。アイコン・アプリ画像・HTML がそろっていないと公開できません。</p>
    <ul id="itemList" class="divide-y text-sm"></ul>
  </section>

  <section class="bg-white rounded-2xl p-5 shadow space-y-3">
    <h2 class="font-semibold">ポイント配布の上限</h2>
    <form id="grantForm" class="grid sm:grid-cols-6 gap-2 items-end text-sm">
      <label class="sm:col-span-2">アプリ<select name="item_id" id="grantItem" class="w-full border rounded-lg px-2 py-1.5"></select></label>
      <label>合計の上限(pt)<input name="max_points" type="number" min="0" required class="w-full border rounded-lg px-2 py-1.5"></label>
      <label>1回の上限(pt)<input name="per_call_max" type="number" min="1" value="500" required class="w-full border rounded-lg px-2 py-1.5"></label>
      <label>1人1分の上限(pt)<input name="per_user_minute_max" type="number" min="0" value="0" class="w-full border rounded-lg px-2 py-1.5"></label>
      <label class="flex items-center gap-1 pb-2"><input type="checkbox" name="active"> 配布する</label>
      <p id="grantInfo" class="sm:col-span-6 text-xs text-gray-500"></p>
      <button class="sm:col-span-6 justify-self-end bg-blue-600 text-white px-4 py-2 rounded-full">保存</button>
    </form>
    <ul id="grantList" class="divide-y text-xs"></ul>
  </section>

  <section class="bg-white rounded-2xl p-5 shadow space-y-3">
    <h2 class="font-semibold">認定開発者</h2>
    <form id="certForm" class="flex flex-wrap gap-2 items-end text-sm">
      <label>ユーザーID（sub）<input name="sub" required class="border rounded-lg px-2 py-1.5 w-80"></label>
      <label class="flex items-center gap-1 pb-2"><input type="checkbox" name="certified" checked> 認定する</label>
      <button class="bg-blue-600 text-white px-4 py-2 rounded-full">設定</button>
    </form>
  </section>

  <section class="bg-white rounded-2xl p-5 shadow space-y-3">
    <h2 class="font-semibold">権限</h2>
    <form id="roleForm" class="flex flex-wrap gap-2 items-end text-sm">
      <label>ユーザーID（sub）<input name="sub" required class="border rounded-lg px-2 py-1.5 w-80"></label>
      <label>権限
        <select name="role" class="border rounded-lg px-2 py-1.5">
          <option value="developer">開発者</option><option value="user">一般</option>
        </select>
      </label>
      <button class="bg-blue-600 text-white px-4 py-2 rounded-full">設定</button>
    </form>
  </section>

  <section class="bg-white rounded-2xl p-5 shadow space-y-3">
    <h2 class="font-semibold">引き換えコード</h2>
    <form id="codeForm" class="flex flex-wrap gap-2 items-end text-sm">
      <label>アプリ<select name="item_id" id="codeItem" class="border rounded-lg px-2 py-1.5"></select></label>
      <label>コード（空欄で自動）<input name="code" class="border rounded-lg px-2 py-1.5 uppercase"></label>
      <label>使用上限<input name="max_uses" type="number" value="1" min="1" class="border rounded-lg px-2 py-1.5 w-24"></label>
      <label>期限<input name="expires_at" type="datetime-local" class="border rounded-lg px-2 py-1.5"></label>
      <button class="bg-blue-600 text-white px-4 py-2 rounded-full">発行</button>
    </form>
    <ul id="codeList" class="divide-y text-sm"></ul>
  </section>
</main>

<script type="module">
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safe = (fn) => async (...args) => { try { await fn(...args); } catch (err) { alert(err.message); } };
  const pt = (n) => `${Number(n || 0).toLocaleString('ja-JP')} pt`;
  const STATUS_LABEL = { draft: '下書き', in_review: '審査中', published: '公開中', suspended: '停止中' };
  const STATUS_CLASS = { draft: 'bg-gray-100', in_review: 'bg-amber-100 text-amber-800', published: 'bg-green-100 text-green-800', suspended: 'bg-red-100 text-red-700' };
  let items = [], grants = [], filter = '';

  async function api(path, { method = 'GET', body } = {}) {
    const opts = { method, credentials: 'same-origin', headers: {} };
    if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    const r = await fetch(path, opts);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
    return j;
  }

  async function boot() {
    const { me } = await api('/api/me');
    if (!me) {
      $('#gate').classList.remove('hidden');
      $('#gate').innerHTML = `<h1 class="text-xl font-semibold">管理者ページ</h1>
        <p class="text-sm text-gray-600">仙人アカウントでログインしてください。</p>
        <a href="/auth/login?next=${encodeURIComponent('/admin.html')}" class="block text-center bg-blue-600 text-white rounded-lg py-2 font-semibold">仙人アカウントでログイン</a>`;
      return;
    }
    $('#whoami').innerHTML = `<span>${esc(me.name || '管理者')}</span>
      <form method="post" action="/auth/logout"><button class="text-gray-500 underline">ログアウト</button></form>`;
    if (me.role !== 'admin') {
      $('#gate').classList.remove('hidden');
      $('#gate').innerHTML = `<h1 class="text-xl font-semibold">管理者権限が必要です</h1>
        <p class="text-sm text-gray-600">このページは管理者だけが使えます。</p>`;
      return;
    }
    $('#app').classList.remove('hidden');
    await Promise.all([loadItems(), loadGrants(), loadCodes()]);
  }

  // ===== 審査・公開 =====
  async function loadItems() {
    items = await api('/api/admin/items');
    renderItems();
  }

  function renderItems() {
    const rows = items.filter(i => !filter || i.status === filter);
    $('#itemList').innerHTML = rows.map(i => {
      const r = i.ready;
      const check = (ok, label) => `<span class="${ok ? 'text-green-700' : 'text-red-600'}">${ok ? '✓' : '✗'} ${label}</span>`;
      const actions = i.status === 'published'
        ? `<button data-act="suspended" data-id="${esc(i.id)}" class="text-red-600 text-xs px-3 py-1.5 rounded-full bg-red-50">停止</button>`
        : `<button data-act="published" data-id="${esc(i.id)}" class="text-white text-xs px-3 py-1.5 rounded-full bg-blue-600">公開</button>`;
      const back = i.status === 'in_review' ? `<button data-act="draft" data-id="${esc(i.id)}" class="text-gray-600 text-xs px-3 py-1.5 rounded-full bg-gray-100">差し戻し</button>` : '';
      return `<li class="py-3 flex flex-wrap items-center justify-between gap-3">
        <div class="min-w-0">
          <div class="font-medium truncate">${esc(i.title)} <span class="text-[11px] text-gray-400 font-mono">${esc(i.id)}</span></div>
          <div class="text-xs text-gray-500 mt-0.5">
            <span class="inline-block px-2 py-0.5 rounded-full ${STATUS_CLASS[i.status] || 'bg-gray-100'}">${STATUS_LABEL[i.status] || esc(i.status)}</span>
            · ${i.price_points ? pt(i.price_points) : '無料'} · 作者 <code class="text-[11px]">${esc(i.owner_sub || '—')}</code>
          </div>
          <div class="text-[11px] mt-1 flex flex-wrap gap-3">${check(r.icon, 'アイコン')}${check(r.image, 'アプリ画像')}${check(r.html, 'HTML')}</div>
        </div>
        <div class="flex gap-2">${back}${actions}</div>
      </li>`;
    }).join('') || '<li class="py-4 text-gray-400">該当するアプリはありません</li>';
  }

  $('#filters').addEventListener('click', (e) => {
    const b = e.target.closest('[data-f]');
    if (!b) return;
    filter = b.dataset.f;
    document.querySelectorAll('#filters [data-f]').forEach(x => {
      const on = x.dataset.f === filter;
      x.className = `px-3 py-1.5 rounded-full ${on ? 'bg-blue-600 text-white' : 'bg-gray-100'}`;
    });
    renderItems();
  });

  $('#itemList').addEventListener('click', safe(async (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const status = b.dataset.act;
    const label = { published: '公開', suspended: '停止', draft: '差し戻し' }[status];
    if (status !== 'published' && !confirm(`このアプリを「${label}」にしますか？`)) return;
    await api(`/api/admin/items/${encodeURIComponent(b.dataset.id)}/status`, { method: 'POST', body: { status } });
    await loadItems();
  }));

  // ===== 配布の上限 =====
  async function loadGrants() {
    grants = await api('/api/admin/grants');
    const opts = grants.map(g => `<option value="${esc(g.item_id)}">${esc(g.title)}</option>`).join('');
    $('#grantItem').innerHTML = opts;
    $('#codeItem').innerHTML = opts;
    $('#grantItem').dispatchEvent(new Event('change'));
    $('#grantList').innerHTML = grants.map(g => `
      <li class="py-1.5 flex justify-between gap-2">
        <span>${esc(g.title)}</span>
        <span>${g.active ? '配布中' : '停止'} · ${pt(g.used_points)} / ${pt(g.max_points)} · 1回 ${pt(g.per_call_max)}</span>
      </li>`).join('') || '<li class="text-gray-400 py-2">アプリはありません</li>';
  }

  $('#grantItem').addEventListener('change', () => {
    const g = grants.find(x => x.item_id === $('#grantItem').value);
    const f = $('#grantForm').elements;
    f.max_points.value = g?.max_points ?? 0;
    f.per_call_max.value = g?.per_call_max ?? 500;
    f.per_user_minute_max.value = g?.per_user_minute_max ?? 0;
    f.active.checked = !!g?.active;
    $('#grantInfo').textContent = g ? `現在 ${pt(g.used_points)} 配布済み。上限はこれより少なくできません。` : '';
  });

  $('#grantForm').addEventListener('submit', safe(async (e) => {
    e.preventDefault();
    const f = e.target.elements;
    const itemId = f.item_id.value;
    await api(`/api/admin/grants/${encodeURIComponent(itemId)}`, {
      method: 'PUT',
      body: {
        max_points: Number(f.max_points.value),
        per_call_max: Number(f.per_call_max.value),
        per_user_minute_max: Number(f.per_user_minute_max.value || 0),
        active: f.active.checked,
      },
    });
    await loadGrants();
    $('#grantItem').value = itemId;
    $('#grantItem').dispatchEvent(new Event('change'));
    alert('配布の設定を保存しました');
  }));

  // ===== 認定開発者・権限 =====
  $('#certForm').addEventListener('submit', safe(async (e) => {
    e.preventDefault();
    const f = e.target.elements;
    await api(`/api/admin/creators/${encodeURIComponent(f.sub.value.trim())}`, { method: 'PUT', body: { certified: f.certified.checked } });
    alert('認定の設定を保存しました');
  }));

  $('#roleForm').addEventListener('submit', safe(async (e) => {
    e.preventDefault();
    const f = e.target.elements;
    await api('/api/admin/accounts/role', { method: 'POST', body: { sub: f.sub.value.trim(), role: f.role.value } });
    alert('権限を設定しました');
  }));

  // ===== 引き換えコード =====
  async function loadCodes() {
    const codes = await api('/api/admin/codes');
    $('#codeList').innerHTML = codes.map(c => `
      <li class="py-2 flex justify-between gap-2">
        <span><b class="font-mono">${esc(c.code)}</b> → ${esc(c.item_id)}（${c.used_count}/${c.max_uses}）${c.expires_at ? ' 期限 ' + new Date(c.expires_at).toLocaleString('ja-JP') : ''}</span>
        <button type="button" data-del-code="${esc(c.code)}" class="text-red-600 text-xs">削除</button>
      </li>`).join('') || '<li class="text-gray-400 py-2">コードはありません</li>';
  }

  $('#codeForm').addEventListener('submit', safe(async (e) => {
    e.preventDefault();
    const f = e.target.elements;
    const exp = f.expires_at.value;
    await api('/api/admin/codes', {
      method: 'POST',
      body: { item_id: f.item_id.value, code: f.code.value || undefined, max_uses: Number(f.max_uses.value) || 1, expires_at: exp ? new Date(exp).toISOString() : null },
    });
    f.code.value = '';
    await loadCodes();
  }));

  $('#codeList').addEventListener('click', safe(async (e) => {
    const c = e.target.dataset.delCode;
    if (!c) return;
    await api(`/api/admin/codes/${encodeURIComponent(c)}`, { method: 'DELETE' });
    await loadCodes();
  }));

  boot().catch(err => alert(err.message));
</script>
</body>
</html>
