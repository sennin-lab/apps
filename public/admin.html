<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>store 管理画面</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#F5F5F7] text-[#1D1D1F] font-sans p-4 sm:p-8">

<section id="login" class="max-w-sm mx-auto mt-20 bg-white rounded-2xl p-6 shadow space-y-3">
  <h1 class="text-xl font-semibold">管理者ログイン</h1>
  <input id="email" type="email" placeholder="メールアドレス" class="w-full border rounded-lg px-3 py-2">
  <input id="password" type="password" placeholder="パスワード" class="w-full border rounded-lg px-3 py-2">
  <button id="loginBtn" class="w-full bg-blue-600 text-white rounded-lg py-2 font-semibold">ログイン</button>
  <p id="loginErr" class="text-red-600 text-sm"></p>
</section>

<main id="app" class="hidden max-w-6xl mx-auto grid lg:grid-cols-2 gap-6">
  <section class="bg-white rounded-2xl p-5 shadow space-y-3">
    <div class="flex items-center justify-between">
      <h2 class="font-semibold text-lg">商品・アプリ</h2>
      <div class="space-x-2">
        <button id="newBtn" class="text-sm px-3 py-1.5 rounded-full bg-blue-600 text-white">＋ 新規</button>
        <button id="logoutBtn" class="text-sm px-3 py-1.5 rounded-full bg-gray-100">ログアウト</button>
      </div>
    </div>
    <ul id="itemList" class="divide-y max-h-[60vh] overflow-y-auto"></ul>
  </section>

  <section class="bg-white rounded-2xl p-5 shadow">
    <h2 class="font-semibold text-lg mb-3">編集</h2>
    <form id="itemForm" class="grid grid-cols-2 gap-2 text-sm">
      <label>ID<input name="id" required class="w-full border rounded px-2 py-1.5"></label>
      <label>種類
        <select name="type" class="w-full border rounded px-2 py-1.5">
          <option value="app">アプリ</option><option value="game">ゲーム</option><option value="product">商品</option>
        </select>
      </label>
      <label class="col-span-2">タイトル<input name="title" required class="w-full border rounded px-2 py-1.5"></label>
      <label class="col-span-2">サブタイトル<input name="subtitle" class="w-full border rounded px-2 py-1.5"></label>
      <label class="col-span-2">説明<textarea name="description" rows="3" class="w-full border rounded px-2 py-1.5"></textarea></label>
      <label>カテゴリ<input name="category_label" class="w-full border rounded px-2 py-1.5"></label>
      <label>開発元<input name="developer" class="w-full border rounded px-2 py-1.5"></label>
      <label>サイズ<input name="size" class="w-full border rounded px-2 py-1.5"></label>
      <label>年齢/認証<input name="age_rating" class="w-full border rounded px-2 py-1.5"></label>
      <label>価格表示<input name="price_text" class="w-full border rounded px-2 py-1.5"></label>
      <label>補足<input name="sub_price_note" class="w-full border rounded px-2 py-1.5"></label>
      <label>バッジ<input name="featured_badge" class="w-full border rounded px-2 py-1.5"></label>
      <label class="col-span-2">ハイライト（カンマ区切り）<input name="highlights" class="w-full border rounded px-2 py-1.5"></label>
      <label class="col-span-2">起動URL（アプリ・ゲーム）<input name="launch_url" placeholder="https://..." class="w-full border rounded px-2 py-1.5"></label>
      <label>起動方法
        <select name="open_mode" class="w-full border rounded px-2 py-1.5">
          <option value="iframe">ホーム内で表示</option><option value="new_tab">別タブで開く</option>
        </select>
      </label>
      <div class="flex items-end gap-4">
        <label class="flex items-center gap-1"><input type="checkbox" name="trending"> トレンド</label>
        <label class="flex items-center gap-1"><input type="checkbox" name="published" checked> 公開</label>
      </div>
      <label class="col-span-2">アイコン画像<input type="file" name="icon" accept="image/*" class="block w-full"></label>
      <label class="col-span-2">プレビュー画像（追加・複数可）<input type="file" name="preview" accept="image/*" multiple class="block w-full"></label>
      <div class="col-span-2 flex justify-between items-center pt-2">
        <button type="button" id="deleteBtn" class="text-red-600 text-sm">削除</button>
        <button class="bg-blue-600 text-white px-5 py-2 rounded-full font-semibold">保存</button>
      </div>
      <p id="saveMsg" class="col-span-2 text-sm text-green-700"></p>
    </form>
    <div class="mt-6 border-t pt-4">
      <h3 class="font-semibold mb-2">レビュー</h3>
      <ul id="reviewList" class="space-y-2 text-sm"></ul>
    </div>
  </section>

  <section class="bg-white rounded-2xl p-5 shadow lg:col-span-2 space-y-3">
    <h2 class="font-semibold text-lg">引き換えコード</h2>
    <form id="codeForm" class="flex flex-wrap gap-2 text-sm items-end">
      <label>商品<select name="item_id" id="codeItem" class="border rounded px-2 py-1.5"></select></label>
      <label>コード（空欄で自動）<input name="code" class="border rounded px-2 py-1.5 uppercase"></label>
      <label>使用上限<input name="max_uses" type="number" value="1" min="1" class="border rounded px-2 py-1.5 w-24"></label>
      <label>期限<input name="expires_at" type="datetime-local" class="border rounded px-2 py-1.5"></label>
      <button class="bg-blue-600 text-white px-4 py-2 rounded-full font-semibold">発行</button>
    </form>
    <ul id="codeList" class="divide-y text-sm"></ul>
  </section>
</main>

<script type="module">
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const cfg = await (await fetch('/api/config')).json();
  const sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  let items = [];
  let current = null;

  async function api(path, { method = 'GET', body } = {}) {
    const { data: { session } } = await sb.auth.getSession();
    const headers = { Authorization: `Bearer ${session?.access_token}` };
    let payload;
    if (body instanceof FormData) payload = body;
    else if (body) { headers['Content-Type'] = 'application/json'; payload = JSON.stringify(body); }
    const r = await fetch(path, { method, headers, body: payload });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
    return j;
  }

  async function uploadImage(file) {
    const fd = new FormData();
    fd.append('image', file);
    return (await api('/api/admin/images', { method: 'POST', body: fd })).url;
  }

  async function loadAll() {
    items = await api('/api/admin/items');
    $('#itemList').innerHTML = items.map(i => `
      <li class="py-2">
        <button data-edit="${esc(i.id)}" class="text-left w-full">
          <div class="font-semibold">${esc(i.title)} ${i.published ? '' : '<span class="text-xs text-gray-400">(非公開)</span>'}</div>
          <div class="text-xs text-gray-500">${esc(i.type)} · ★${i.rating} · ${esc(i.id)}</div>
        </button>
      </li>`).join('');
    $('#codeItem').innerHTML = items.map(i => `<option value="${esc(i.id)}">${esc(i.title)}</option>`).join('');

    const codes = await api('/api/admin/codes');
    $('#codeList').innerHTML = codes.map(c => `
      <li class="py-2 flex justify-between gap-2">
        <span><b class="font-mono">${esc(c.code)}</b> → ${esc(c.item_id)}（${c.used_count}/${c.max_uses}）
          ${c.expires_at ? '期限 ' + new Date(c.expires_at).toLocaleString('ja-JP') : ''}</span>
        <button data-del-code="${esc(c.code)}" class="text-red-600">削除</button>
      </li>`).join('') || '<li class="text-gray-400">コードはありません</li>';
  }

  function fill(item) {
    current = item ? { ...item } : { type: 'app', published: true, open_mode: 'iframe', preview_images: [], highlights: [] };
    const f = $('#itemForm');
    f.reset();
    for (const [k, v] of Object.entries(current)) {
      const el = f.elements[k];
      if (!el) continue;
      if (el.type === 'checkbox') el.checked = !!v;
      else el.value = Array.isArray(v) ? v.join(', ') : (v ?? '');
    }
    f.elements.id.readOnly = !!item;
    loadReviews(item?.id);
  }

  async function loadReviews(itemId) {
    const ul = $('#reviewList');
    if (!itemId) { ul.innerHTML = '<li class="text-gray-400">商品を保存すると表示されます</li>'; return; }
    const revs = await api(`/api/admin/reviews?item_id=${encodeURIComponent(itemId)}`);
    ul.innerHTML = revs.map(r => `
      <li class="flex justify-between gap-2 border-b pb-1">
        <span>★${r.rating} <b>${esc(r.title)}</b> <span class="text-gray-500">${esc(r.body)}</span></span>
        <button data-del-rev="${esc(r.id)}" class="text-red-600 shrink-0">削除</button>
      </li>`).join('') || '<li class="text-gray-400">レビューはありません</li>';
  }

  $('#itemList').addEventListener('click', (e) => {
    const id = e.target.closest('[data-edit]')?.dataset.edit;
    if (id) fill(items.find(i => i.id === id));
  });
  $('#newBtn').onclick = () => fill(null);

  $('#itemForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    const fd = new FormData(f);
    try {
      const body = {
        id: fd.get('id'),
        type: fd.get('type'),
        title: fd.get('title'),
        subtitle: fd.get('subtitle'),
        description: fd.get('description'),
        category_label: fd.get('category_label'),
        developer: fd.get('developer'),
        size: fd.get('size'),
        age_rating: fd.get('age_rating'),
        price_text: fd.get('price_text'),
        sub_price_note: fd.get('sub_price_note'),
        featured_badge: fd.get('featured_badge'),
        highlights: String(fd.get('highlights')).split(',').map(s => s.trim()).filter(Boolean),
        launch_url: fd.get('launch_url') || null,
        open_mode: fd.get('open_mode'),
        trending: f.elements.trending.checked,
        published: f.elements.published.checked,
        icon_url: current?.icon_url ?? null,
        preview_images: [...(current?.preview_images ?? [])],
      };
      const icon = fd.get('icon');
      if (icon && icon.size) body.icon_url = await uploadImage(icon);
      for (const file of f.elements.preview.files) body.preview_images.push(await uploadImage(file));

      const saved = await api('/api/admin/items', { method: 'POST', body });
      await loadAll();
      fill(saved);
      $('#saveMsg').textContent = '保存しました';
    } catch (err) {
      $('#saveMsg').textContent = '';
      alert('保存に失敗しました: ' + err.message);
    }
  });

  $('#deleteBtn').onclick = async () => {
    if (!current?.id || !confirm(`「${current.title}」を削除しますか？`)) return;
    await api(`/api/admin/items/${encodeURIComponent(current.id)}`, { method: 'DELETE' });
    await loadAll();
    fill(null);
  };

  $('#reviewList').addEventListener('click', async (e) => {
    const id = e.target.dataset.delRev;
    if (!id || !confirm('このレビューを削除しますか？')) return;
    await api(`/api/admin/reviews/${encodeURIComponent(id)}`, { method: 'DELETE' });
    await loadAll();
    loadReviews(current.id);
  });

  $('#codeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const exp = fd.get('expires_at');
    try {
      await api('/api/admin/codes', {
        method: 'POST',
        body: {
          item_id: fd.get('item_id'),
          code: fd.get('code') || undefined,
          max_uses: Number(fd.get('max_uses')) || 1,
          expires_at: exp ? new Date(exp).toISOString() : null,
        },
      });
      e.target.code.value = '';
      await loadAll();
    } catch (err) { alert(err.message); }
  });

  $('#codeList').addEventListener('click', async (e) => {
    const c = e.target.dataset.delCode;
    if (!c) return;
    await api(`/api/admin/codes/${encodeURIComponent(c)}`, { method: 'DELETE' });
    await loadAll();
  });

  async function enter() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return;
    try {
      await loadAll();
      $('#login').classList.add('hidden');
      $('#app').classList.remove('hidden');
      fill(null);
    } catch (err) {
      $('#loginErr').textContent = '管理者権限がありません（' + err.message + '）';
      await sb.auth.signOut();
    }
  }

  $('#loginBtn').onclick = async () => {
    const { error } = await sb.auth.signInWithPassword({
      email: $('#email').value, password: $('#password').value,
    });
    if (error) return ($('#loginErr').textContent = error.message);
    enter();
  };
  $('#logoutBtn').onclick = async () => { await sb.auth.signOut(); location.reload(); };

  enter();
</script>
</body>
</html>
